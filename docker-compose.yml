services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-assignment_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Backend
      dockerfile: AssignmentManagement.API/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignment_management};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env - 32+ random characters}
      Jwt__Issuer: AssignmentManagementSystem
      Jwt__Audience: AssignmentManagementSystem
      Jwt__ExpiryMinutes: "60"
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5011:8080"

  frontend:
    build:
      context: ./Frontend/assignment-management-ui
      args:
        NEXT_PUBLIC_API_BASE_URL: ${API_URL:-http://localhost:5011}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data: